<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riaz – Free Image Compressor | Reduce Photo Size Without Quality Loss</title>
<meta name="description" content="Compress JPG, PNG and WebP images to an exact size like 100–150 KB. Free, private and runs entirely in your browser.">
<style>
:root{color-scheme:dark;--bg:#0F172A;--bg2:#0F172A;--card:#1E293B;--tx:#F8FAFC;--mut:#94A3B8;--bd:#334155;--ac:#6366F1;--ac2:#3B82F6;--ok:#34d399;--sh:0 10px 40px rgba(0,0,0,.45)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
a{color:inherit;text-decoration:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(700px 480px at 12% -4%,rgba(99,102,241,.30),transparent 70%),radial-gradient(640px 460px at 92% 8%,rgba(59,130,246,.22),transparent 70%),radial-gradient(620px 420px at 50% 105%,rgba(139,92,246,.20),transparent 70%)}
.c{max-width:1040px;margin:auto;padding:0 20px}
nav{position:sticky;top:0;z-index:9;background:rgba(15,23,42,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
nav .c{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:.95rem}
.links{display:flex;gap:26px;font-size:.92rem;color:var(--mut)}
.links a:hover{color:var(--tx)}
@media(max-width:640px){.links{display:none}}
.hero{text-align:center;padding:64px 0 36px;}
.pill{display:inline-block;padding:6px 14px;border:1px solid var(--bd);border-radius:99px;font-size:.8rem;color:var(--mut);background:var(--bg2)}
h1{font-size:clamp(2rem,5.5vw,3.4rem);line-height:1.12;margin:18px auto 14px;max-width:760px;letter-spacing:-.02em}
h1 span{background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:560px;margin:0 auto;font-size:1.08rem}
.tool{background:rgba(30,41,59,.55);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid #334155;border-radius:20px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.06);padding:22px;margin:34px 0 0}
#drop{display:block;text-transform:none;letter-spacing:0;font-size:1rem;font-weight:400;color:var(--tx);margin:0;border:2px dashed #475569;border-radius:16px;padding:44px 16px;text-align:center;cursor:pointer;background:rgba(15,23,42,.45);transition:.15s}
#drop:hover,#drop.on{border-color:var(--ac);transform:translateY(-1px)}
#drop b{display:block;font-size:1.1rem;margin:10px 0 2px}
#drop small,.mt{color:var(--mut);font-size:.86rem}
.ico{width:46px;height:46px;border-radius:14px;margin:auto;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:18px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
input[type=number],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #475569;background:rgba(15,23,42,.6);color:var(--tx);font-size:1rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{padding:6px 13px;border-radius:99px;border:1px solid #475569;background:rgba(15,23,42,.6);color:var(--tx);font-size:.85rem;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:.9rem;display:inline-block}
.btn.o{background:transparent;color:#a5b4fc;border:1px solid #6366F1}
#res{margin-top:22px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:rgba(15,23,42,.45);border:1px solid #334155;margin-bottom:6px}
.sum b{color:var(--ok)}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd)}
.item img{width:68px;height:68px;border-radius:10px;object-fit:cover;background:var(--bg2)}
.inf{flex:1;min-width:0}.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv{color:var(--ok);font-weight:700}
section{padding:70px 0}
h2{font-size:clamp(1.5rem,3.5vw,2.1rem);text-align:center;margin:0 0 8px;letter-spacing:-.01em}
.sub{text-align:center;color:var(--mut);margin:0 auto 38px;max-width:520px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{border:1px solid var(--bd);border-radius:16px;padding:24px;background:var(--bg)}
.card h3{margin:14px 0 6px;font-size:1.05rem}.card p{margin:0;color:var(--mut);font-size:.94rem}
.alt{background:var(--bg2)}
.num{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:700}
details{border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--bg)}
summary{cursor:pointer;font-weight:600}details p{color:var(--mut);margin:10px 0 0}
.faq{max-width:720px;margin:auto}
footer{border-top:1px solid var(--bd);padding:28px 0;text-align:center;color:var(--mut);font-size:.88rem}
</style>
</head>
<body>
<nav><div class="c">
  <a class="logo" href="#"><i>▼</i>RIAZ</a>
  <a class="btn" href="#tool">Compress now</a>
</div></nav>

<header class="hero"><div class="c">
  <span class="pill">🔒 100% private · Free · No signup</span>
  <h1>Shrink photos to <span>100–150 KB</span> without losing quality</h1>
  <div class="tool" id="tool">
    <label id="drop" for="f">
      <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div>
      <b>Drop images here or click to browse</b><small>JPG, PNG, WebP · multiple files supported</small>
    </label>
    <input type="file" id="f" accept="image/*" multiple class="vh">
    <div class="opts" style="text-align:left">
      <div><label>Target size (KB)</label><input type="number" id="kb" value="150" min="20" max="5000">
        <div class="chips" id="chips"><button class="chip" data-v="100">100 KB</button><button class="chip on" data-v="150">150 KB</button><button class="chip" data-v="200">200 KB</button><button class="chip" data-v="500">500 KB</button></div></div>
      <div><label>Output format</label><select id="fmt"><option value="image/jpeg">JPG – works everywhere</option><option value="image/webp">WebP – smaller files</option></select></div>
      <div><label>Max width / height (px)</label><input type="number" id="dim" value="2000" min="300" max="8000"></div>
    </div>
    <div id="res" hidden style="text-align:left">
      <div class="sum"><span id="tot"></span><button class="btn o" id="all">⬇ Download all</button></div>
      <div id="list"></div>
    </div>
  </div>
</div></header>

<footer><div class="c">© <span id="yr"></span> Riaz · Free image compressor · Your images never leave your browser</div></footer>

<script>
const $=id=>document.getElementById(id);
const drop=$('drop'),inp=$('f'),list=$('list'),out=[];
let totO=0,totN=0;
$('yr').textContent=new Date().getFullYear();
const fmt=b=>b>=1048576?(b/1048576).toFixed(2)+' MB':Math.round(b/1024)+' KB';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
inp.onchange=()=>{const fl=Array.from(inp.files);inp.value='';handle(fl)};
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,v=>{v.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,v=>{v.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',v=>handle(Array.from(v.dataTransfer.files)));
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;$('kb').value=b.dataset.v;sync()};
function sync(){document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v===$('kb').value))}
$('kb').oninput=sync;
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));

async function compress(file,maxB,type,maxDim){
  const bmp=await createImageBitmap(file);
  let scale=Math.min(1,maxDim/Math.max(bmp.width,bmp.height));
  const lossy=/jpe?g|webp/.test(file.type);
  if(lossy&&file.size>maxB*2)scale=Math.min(scale,Math.max(.15,Math.sqrt(maxB/file.size)*2));
  const c=document.createElement('canvas'),x=c.getContext('2d');
  for(let r=0;r<10;r++){
    c.width=Math.max(1,Math.round(bmp.width*scale));c.height=Math.max(1,Math.round(bmp.height*scale));
    x.imageSmoothingQuality='high';
    if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}else x.clearRect(0,0,c.width,c.height);
    x.drawImage(bmp,0,0,c.width,c.height);
    if(r===0&&file.size<=maxB*2){const top=await toBlob(c,type,.92);if(top.size<=maxB)return{blob:top,w:c.width,h:c.height}}
    let lo=.6,hi=.92,best=null;
    for(let i=0;i<5;i++){const m=(lo+hi)/2,b=await toBlob(c,type,m);if(b.size<=maxB){best=b;lo=m}else hi=m}
    if(best)return{blob:best,w:c.width,h:c.height};
    scale*=.85;
  }
  return{blob:await toBlob(c,type,.6),w:c.width,h:c.height};
}

async function handle(files){
  const maxB=(+$('kb').value||150)*1024,type=$('fmt').value,dim=+$('dim').value||2000,ext=type==='image/webp'?'webp':'jpg';
  $('res').hidden=false;
  for(const file of files){
    if(!file.type.startsWith('image/'))continue;
    const row=document.createElement('div');row.className='item';
    row.innerHTML=`<div class="inf"><div class="nm">${esc(file.name)}</div><div class="mt">Compressing…</div></div>`;
    list.prepend(row);
    try{
      const r=await compress(file,maxB,type,dim);
      const url=URL.createObjectURL(r.blob),name=file.name.replace(/\.[^.]+$/,'')+'-compressed.'+ext;
      const saved=Math.max(0,Math.round((1-r.blob.size/file.size)*100));
      out.push({url,name});totO+=file.size;totN+=r.blob.size;
      row.innerHTML=`<img src="${url}" alt=""><div class="inf"><div class="nm">${esc(name)}</div><div class="mt">${fmt(file.size)} → <b>${fmt(r.blob.size)}</b> · ${r.w}×${r.h}px · <span class="sv">−${saved}%</span></div></div><a class="btn" href="${url}" download="${esc(name)}">Download</a>`;
      $('tot').innerHTML=`${out.length} image${out.length>1?'s':''} · saved <b>${fmt(totO-totN)}</b> (${Math.round((1-totN/totO)*100)}%)`;
    }catch(e){row.querySelector('.mt').textContent='Could not process this image.'}
  }
}
$('all').onclick=()=>out.forEach((o,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=o.url;a.download=o.name;a.click()},i*300));
</script>
</body>
</html>
